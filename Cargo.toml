[workspace]
resolver = "2"
members = ["crates/*"]
# GPUI's Windows backend and gilrs-core are vendored only to patch them (see their
# PATCHES.md), so they stay out of the workspace and its own lints.
exclude = ["crates/gpui-pre-windows", "crates/gilrs-core"]

[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_futures = "warn"
needless_collect = "warn"

[workspace.dependencies]
irori-core = { path = "crates/core" }
irori-secrets = { path = "crates/secrets" }
comet = { path = "crates/comet" }
irori-runtime = { path = "crates/runtime" }
irori-engines = { path = "crates/engines" }
irori-epic = { path = "crates/store-epic" }
irori-gog = { path = "crates/store-gog" }
irori-amazon = { path = "crates/store-amazon" }
irori-zoom = { path = "crates/store-zoom" }
irori-sideload = { path = "crates/store-sideload" }
irori-emulation = { path = "crates/store-emulation" }
irori-launchers = { path = "crates/store-launchers" }
irori-steam = { path = "crates/store-steam" }
irori-sign-in = { path = "crates/sign-in" }
irori-depot = { path = "crates/depot" }
irori-amazon-api = { path = "crates/amazon" }
irori-epic-api = { path = "crates/epic" }
irori-gog-api = { path = "crates/gog" }
irori-gog-galaxy = { path = "crates/gog-galaxy" }
irori-itch-api = { path = "crates/itch" }
irori-steam-api = { path = "crates/steam" }
irori-retroachievements-api = { path = "crates/retroachievements" }
irori-xbox-api = { path = "crates/xbox" }
irori-itch = { path = "crates/store-itch" }
irori-launchers-data = { path = "crates/launchers" }
irori-services = { path = "crates/services" }
irori-extras = { path = "crates/extras" }
irori-ui = { path = "crates/ui" }
irori-library = { path = "crates/feature-library" }
irori-game = { path = "crates/feature-game" }
irori-settings = { path = "crates/feature-settings" }
irori-manage = { path = "crates/feature-manage" }
irori-bigpicture = { path = "crates/feature-bigpicture" }
irori-scripts = { path = "crates/scripts" }
irori-mods = { path = "crates/mods" }
irori-reshade = { path = "crates/reshade" }
irori-msstore-api = { path = "crates/msstore" }
irori-msixvc = { path = "crates/msixvc" }
irori-xbox = { path = "crates/store-xbox" }

gpui-kit = "0.8.0"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream", "cookies"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
once_cell = "1"
# Icon and version details in the Windows executables (build scripts only).
winresource = { version = "0.1.34", default-features = false }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
notify = "8"
url = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
keyring-core = "1"
# async-io, like every other zbus user here: zbus' tokio backend makes a shared
# D-Bus connection opened on a Tokio thread panic when GPUI's threads use it.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
lzma-rs = "0.3"
fs4 = "1"
plist = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_yaml_ng = "0.10"
hex = "0.4"
nix = { version = "0.31", features = ["signal", "process", "fs", "user"] }
which = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.14"
bzip2 = "0.6"  # pure-Rust backend by default
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util"] }
open = "5"
fuzzy-matcher = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# GPUI's Windows backend with Irori's fixes; crates/gpui-pre-windows/PATCHES.md
# lists them. Keep its version equal to gpui-pre's.
[patch.crates-io]
gpui-pre-windows = { path = "crates/gpui-pre-windows" }
gilrs-core = { path = "crates/gilrs-core" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Native CI builds should fit hosted runners without spending time optimizing
# the entire GPUI dependency tree or retaining large debug/incremental data.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

# Fast local contributor build with release-like runtime performance.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = false

# Release speed with symbols, for `perf`/`heaptrack`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = "thin"
codegen-units = 16

[workspace.metadata.cargo-machete]
# `md-5` exposes crate `md5`; `serde_ini` is upstream in vendored `crates/comet`.
ignored = ["md-5", "serde_ini"]
