[package]
name = "irori-services"
description = "Irori's backend facade: library aggregation, settings, download queue, launching and game operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-secrets.workspace = true
irori-depot.workspace = true
irori-runtime.workspace = true
irori-engines.workspace = true
sysinfo.workspace = true
irori-extras.workspace = true
irori-scripts.workspace = true
irori-mods.workspace = true
irori-reshade.workspace = true
# Steam's public achievement schema, for achievements games keep in their own
# files (`file_achievements`).
irori-steam-api.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
discord-rich-presence = "1.1"
once_cell.workspace = true
fuzzy-matcher.workspace = true
fs4.workspace = true
dirs.workspace = true
which.workspace = true
plist.workspace = true
# Sunshine's covers: game art turned into the PNG it wants, sent as base64.
image.workspace = true
base64.workspace = true
# The hidden-games PIN: a salted, stretched hash.
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's Inhibit, NetworkMonitor, GlobalShortcuts (the clip
# shortcut) and Screenshot (the controller's screenshot), with the features
# GPUI already builds ashpd with.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "inhibit", "network_monitor", "screenshot"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # The in-game overlay's screenshot (GDI, the game's monitor).
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
] }
# The in-game overlay's volumes (Core Audio, a COM API), at the version GPUI
# builds.
windows = { version = "0.62", features = [
    # The sound outputs' names, for switching the output.
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Windows' per-program graphics preference (`gpu_preference`); the version is
# already in Cargo.lock.
windows-registry = "0.6"
# `IPolicyConfig` (switching the sound output) is declared with
# `windows::core::interface`, whose expansion names this crate.
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
irori-depot = { workspace = true, features = ["test-server"] }
