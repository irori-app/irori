[package]
name = "irori-ui"
description = "Shared UI layer: backend bridge, observable models, navigation, art pipeline, theme and common components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-services.workspace = true
irori-engines.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image.workspace = true
sha2.workspace = true
hex.workspace = true
open.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
notify.workspace = true
ron = { version = "0.12", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# gpui-kit/test-support pulls the GPUI Fast crates, which conflict with gpui-pre in the
# lockfile; GPUI's own test support exposes the test harness through `gpui_kit::*`.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo.workspace = true
# The accent, high contrast and transparency effects, at the version GPUI builds.
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The accent, highlight colour and display options, at the versions GPUI builds.
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSAccessibility",
    "NSAppearance",
    "NSColor",
    "NSColorSpace",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's accent colour, with the features GPUI already builds ashpd with.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3.15", features = ["client_system"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
x11rb = { version = "0.13.1", default-features = false }
