[package]
name = "irori-msixvc"
description = "Microsoft Store (GDK) MSIXVC packages: XVD parsing, XTS decryption, hash tree, NTFS layout, streaming install, resume, update and repair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Versions here follow the Xodus code this crate ports (its XTS and parsing
# rely on the `aes` 0.9 / `hybrid-array` API); only this crate needs them.
[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true, features = ["io-util"] }
reqwest.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
aes = "0.9"
sha2-11 = { package = "sha2", version = "0.11" }
bitflags = "2"
bytes = "1"
futures-util = "0.3"
gpt = "4"
ntfs = "0.4"
num_enum = "0.7"
pin-project = "1"
typenum = { version = "1.18", features = ["const-generics"] }
generic-array = "1.2"
zerocopy = { version = "0.8", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
