[package]
name = "irori-bigpicture"
description = "Big Picture: controller input for the whole app and a 10-foot fullscreen library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-services.workspace = true
irori-engines.workspace = true
irori-ui.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
futures.workspace = true
tracing.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
image.workspace = true
tokio.workspace = true
gilrs = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The in-game overlay holds the controllers from the game (EVIOCGRAB) and
# reads them itself meanwhile.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The in-game overlay's keyboard shortcut (RegisterHotKey) and its check for
# a game in exclusive fullscreen; already in the lockfile.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
regex.workspace = true
tempfile = "3"
# `gpui-kit/test-support` must not be enabled (it pulls the optional GPUI Fast
# crates into resolution). GPUI's own test support exposes `TestAppContext` and
# `#[gpui_kit::test]` through `gpui_kit::*` by feature unification.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
