<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f2ef;
    --fg: #1f1c19;
    --muted: #6b645d;
    --field: #ffffff;
    --border: rgba(0, 0, 0, 0.1);
    --hover: rgba(0, 0, 0, 0.06);
    --warn: #a4400f;
    --focus: #3b6fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18;
      --fg: #eeeae5;
      --muted: #a59d94;
      --field: #282522;
      --border: rgba(255, 255, 255, 0.1);
      --hover: rgba(255, 255, 255, 0.08);
      --warn: #f08a54;
      --focus: #7fa6ff;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
  }
  button {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #address {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    margin: 0 6px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--field);
    color: var(--muted);
  }
  #address svg { flex: none; width: 14px; height: 14px; }
  #address.insecure { color: var(--warn); }
  #url {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    user-select: text;
    -webkit-user-select: text;
  }
  #insecure { display: none; flex: none; font-weight: 600; }
  #address.insecure #insecure { display: inline; }
  #lock-open { display: none; }
  #address.insecure #lock { display: none; }
  #address.insecure #lock-open { display: block; }
</style>
</head>
<body>
  <button id="back" data-label="back" data-command="back">
    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button id="forward" data-label="forward" data-command="forward">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button id="reload" data-label="reload" data-command="reload">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
  <button id="home" data-label="home" data-command="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/></svg>
  </button>
  <div id="address">
    <svg id="lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <svg id="lock-open" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
    <span id="insecure"></span>
    <span id="url"></span>
  </div>
  <button id="external" data-label="external" data-command="external">
    <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
  </button>
<script>
  const labels = /*LABELS*/;
  for (const button of document.querySelectorAll("button")) {
    const label = labels[button.dataset.label] || "";
    button.title = label;
    button.setAttribute("aria-label", label);
    button.addEventListener("click", () => window.ipc.postMessage(button.dataset.command));
  }
  document.getElementById("insecure").textContent = labels.insecure || "";
  window.irori = {
    // The page's address, as the window read it from the page itself.
    setAddress(url) {
      const secure = url.startsWith("https://") || url === "about:blank";
      document.getElementById("url").textContent = url;
      document.getElementById("address").classList.toggle("insecure", !secure);
    },
  };
</script>
</body>
</html>
