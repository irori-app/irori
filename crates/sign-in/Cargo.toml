[package]
name = "irori-sign-in"
description = "Irori's sign-in and store windows: a store's login page or website in a window of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "irori-sign-in"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
tao = "0.34"
uuid.workspace = true
wry = "0.53"

[target.'cfg(target_os = "macos")'.dependencies]
# The version tray-icon already brings in, for the store window's Edit menu.
muda = { version = "0.17", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The version Wry pins, so pop-ups share its WebKitGTK types.
webkit2gtk = { version = "=2.0.1", features = ["v2_40"] }

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# Packaged on its own (see `crates/irori/Cargo.toml`), so Irori's package never
# requires WebKitGTK.
[package.metadata.deb]
maintainer = "Diaconu Radu-Mihai <52667211+countradooku@users.noreply.github.com>"
copyright = "Irori developers"
license-file = ["../../LICENSE", "0"]
extended-description = """\
The window Irori shows a store's sign-in page or website in. Without it, \
Irori opens those pages in the browser."""
section = "games"
priority = "optional"
depends = "$auto"
assets = [["target/release/irori-sign-in", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
summary = "Irori's store sign-in window"
url = "https://irori.app"
assets = [
    { source = "target/release/irori-sign-in", dest = "/usr/bin/irori-sign-in", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/irori-sign-in/LICENSE", mode = "644", doc = true },
]
