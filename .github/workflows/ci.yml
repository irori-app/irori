name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Checkout PR history for path classification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "code_changed=true"
          else
            python3 .github/scripts/ci_changes.py
          fi

  check:
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux
          - os: macos-15
            platform: macos
          - os: macos-15-intel
            platform: macos
          - os: windows-2022
            platform: windows
          - os: windows-11-arm
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip native Rust build on docs-only pull request
        if: needs.changes.outputs.code_changed != 'true'
        run: |
          echo "Docs/governance-only pull request: skipping native Rust build and packaging (verified by PR rules)."
      - if: needs.changes.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust and clang on Windows on Arm
        if: needs.changes.outputs.code_changed == 'true' && matrix.os == 'windows-11-arm'
        uses: ./.github/actions/windows-arm64-tools
      - name: Linux system libraries
        if: needs.changes.outputs.code_changed == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            libudev-dev libssl-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev xvfb
      - if: needs.changes.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - if: needs.changes.outputs.code_changed == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-ci-profile-v1
          cache-on-failure: true
      - if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Packaging regression tests
        if: needs.changes.outputs.code_changed == 'true'
        run: python -m unittest discover -s packaging -p "test_*.py"
      - if: needs.changes.outputs.code_changed == 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.code_changed == 'true'
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Tests (Linux display)
        if: needs.changes.outputs.code_changed == 'true' && runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --workspace --no-fail-fast --profile ci
      - name: Tests
        if: needs.changes.outputs.code_changed == 'true' && runner.os != 'Linux'
        run: cargo test --locked --workspace --no-fail-fast --profile ci
      - name: Build desktop and sign-in helper
        if: needs.changes.outputs.code_changed == 'true'
        run: cargo build --locked --profile ci -p irori -p irori-sign-in
      - name: Package native application
        if: needs.changes.outputs.code_changed == 'true'
        run: python packaging/package.py --platform ${{ matrix.platform }} --binary-dir target/ci --output dist
      - name: Verify per-user Windows installation
        if: needs.changes.outputs.code_changed == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Irori installation test'
          & ./dist/Irori/install.ps1 -Destination $destination
          $files = @('irori.exe', 'irori-sign-in.exe', 'irori.ico', 'vcruntime140.dll')
          # Only x64 programs import vcruntime140_1.dll.
          if ('${{ matrix.os }}' -ne 'windows-11-arm') { $files += 'vcruntime140_1.dll' }
          foreach ($name in $files) {
            if (!(Test-Path -LiteralPath (Join-Path $destination $name))) {
              throw "Missing installed file: $name"
            }
          }
          $exe = Join-Path $destination 'irori.exe'
          $versionOutput = Join-Path $env:RUNNER_TEMP 'irori-version.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionOutput
          if ($process.ExitCode -ne 0 -or (Get-Content $versionOutput -Raw) -notmatch '^irori [0-9]+\.[0-9]+\.[0-9]+') {
            throw 'Installed Irori failed to start'
          }
          foreach ($name in @('irori.exe', 'irori-sign-in.exe')) {
            $info = (Get-Item -LiteralPath (Join-Path $destination $name)).VersionInfo
            if ($info.ProductName -ne 'Irori' -or $info.FileVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') {
              throw "$name has no embedded version details"
            }
          }
          $helper = Join-Path $destination 'irori-sign-in.exe'
          $helperError = Join-Path $env:RUNNER_TEMP 'irori-helper-error.txt'
          $process = Start-Process -FilePath $helper -ArgumentList '--unsupported' -Wait -PassThru -RedirectStandardError $helperError
          if ($process.ExitCode -ne 1 -or (Get-Content $helperError -Raw) -notmatch 'unknown argument --unsupported') {
            throw 'Installed sign-in helper failed to load'
          }
          $command = (Get-Item 'HKCU:\Software\Classes\irori\shell\open\command').GetValue('')
          if ($command -ne ('"' + $exe + '" "%1"')) { throw 'Invalid URL handler' }
          $menu = [Environment]::GetFolderPath('Programs')
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut((Join-Path $menu 'Irori.lnk'))
          if ($link.TargetPath -ne $exe) { throw 'Invalid Start menu shortcut' }
      - if: needs.changes.outputs.code_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Irori-${{ matrix.os }}-unsigned
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  audit:
    needs: [changes]
    runs-on: ubuntu-24.04
    steps:
      - name: Skip cargo-deny on docs-only pull request
        if: needs.changes.outputs.code_changed != 'true'
        run: |
          echo "Docs/governance-only pull request: skipping cargo-deny audit."
      - if: needs.changes.outputs.code_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code_changed == 'true'
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check advisories licenses bans sources
