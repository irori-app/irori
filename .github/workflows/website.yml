name: Website

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/website.yml]
  pull_request:
    paths: [website/**, .github/workflows/website.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('website/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The container serves the site
        run: |
          docker build -t irori-website .
          docker run -d --rm -p 8080:80 --name site irori-website
          sleep 2
          curl -fsSL http://localhost:8080/ | grep -q '<title>Irori: '
          curl -fsSL http://localhost:8080/code-signing | grep -q '<title>Irori code signing policy</title>'
          curl -fsS -o /dev/null http://localhost:8080/screenshots/library.webp
          curl -fsS -o /dev/null http://localhost:8080/covers/games/$(ls public/covers/games | head -n 1)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-page)" = 404
          docker stop site
