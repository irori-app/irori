name: Publish

# Runs when a release is published (after its draft is reviewed) and sends it to
# each package channel. Every channel is switched on by a repository variable
# and needs its own secret; docs/RELEASING.md lists them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Where the apt and dnf repositories are served: this repository's GitHub
  # Pages under its custom domain (docs/RELEASING.md).
  PACKAGES_URL: https://packages.irori.app

jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      # The scripts come from the default branch, so publishing an older
      # release again reaches channels added since; the tag gives its commit
      # and Flatpak manifest.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --ignore-missing SHA256SUMS
      - name: Package-manager manifests
        run: |
          git show "$TAG:packaging/flatpak/app.irori.Irori.yml" > "$RUNNER_TEMP/flatpak.yml"
          python3 packaging/release_manifests.py --version "$TAG" --dist dist --repo "$GITHUB_REPOSITORY" \
            --output manifests --commit "$(git rev-list -n 1 "$TAG")" --flatpak-manifest "$RUNNER_TEMP/flatpak.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: manifests

  # The pacman repository (x86-64 only, as Arch Linux is), signed with the
  # packaging key. repo-add needs Arch's own tools, so it is built here and
  # served with the others below.
  arch-repository:
    if: vars.PUBLISH_PACKAGE_REPOSITORIES == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Sign the packages and build the repository
        env:
          KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          # pacman's download sandbox does not work in every container
          # (packaging/arch/build.sh does the same).
          sed -i -e 's/^#\?DisableSandboxSyscalls/DisableSandboxSyscalls/' \
            -e 's/^#\?DisableSandboxFilesystem/DisableSandboxFilesystem/' \
            -e 's/^DownloadUser/#DownloadUser/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          mkdir -p site/arch/x86_64
          cp dist/*.pkg.tar.zst site/arch/x86_64/
          cd site/arch/x86_64
          for package in *.pkg.tar.zst; do
            gpg --batch --yes --local-user "$fingerprint" --detach-sign --no-armor "$package"
          done
          repo-add --sign --key "$fingerprint" irori.db.tar.gz ./*.pkg.tar.zst
          # GitHub Pages serves no symbolic links, and repo-add makes irori.db
          # and irori.files links to their archives.
          find . -type l -exec sh -c 'cp --remove-destination "$(readlink "$1")" "$1"' _ {} \;
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: arch-site
          path: site

  # apt, dnf and pacman repositories on this repository's GitHub Pages.
  repositories:
    if: vars.PUBLISH_PACKAGE_REPOSITORIES == 'true'
    needs: [assets, arch-repository]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arch-site
          path: site
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm gnupg
      - name: Import the signing key
        env:
          KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          printf '%%_gpg_name %s\n' "$fingerprint" > ~/.rpmmacros
      - name: Build the repositories
        run: |
          base="$PACKAGES_URL"
          mkdir -p site/apt/pool/main site/rpm/x86_64 site/rpm/aarch64
          cp dist/*.deb site/apt/pool/main/
          cp dist/*.x86_64.rpm site/rpm/x86_64/
          cp dist/*.aarch64.rpm site/rpm/aarch64/
          rpm --addsign site/rpm/*/*.rpm

          cd site/apt
          # One pool, and a package list per architecture.
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
            apt-ftparchive --arch "$arch" packages pool > "dists/stable/main/binary-$arch/Packages"
            gzip -k9 "dists/stable/main/binary-$arch/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Irori -o APT::FTPArchive::Release::Label=Irori \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release
          gpg --batch --yes --local-user "$FINGERPRINT" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$FINGERPRINT" -abs -o dists/stable/Release.gpg dists/stable/Release
          cd ../..

          createrepo_c site/rpm
          gpg --batch --yes --local-user "$FINGERPRINT" --detach-sign --armor site/rpm/repodata/repomd.xml

          gpg --export "$FINGERPRINT" > site/irori.gpg
          gpg --armor --export "$FINGERPRINT" > site/irori.asc
          cat > site/irori.repo <<EOF
          [irori]
          name=Irori
          baseurl=$base/rpm
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$base/irori.asc
          EOF
          echo "deb [signed-by=/usr/share/keyrings/irori.gpg] $base/apt stable main" > site/irori.list
          cat > site/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>Irori packages</title>
          <h1>Irori packages</h1>
          <h2>Debian and Ubuntu</h2>
          <pre>curl -fsSL $base/irori.gpg | sudo tee /usr/share/keyrings/irori.gpg &gt; /dev/null
          curl -fsSL $base/irori.list | sudo tee /etc/apt/sources.list.d/irori.list
          sudo apt update &amp;&amp; sudo apt install irori</pre>
          <h2>Fedora and openSUSE</h2>
          <pre>sudo curl -fsSLo /etc/yum.repos.d/irori.repo $base/irori.repo
          sudo dnf install irori</pre>
          <h2>Arch Linux</h2>
          <pre>curl -fsSLo /tmp/irori.asc $base/irori.asc
          sudo pacman-key --add /tmp/irori.asc
          sudo pacman-key --lsign-key $FINGERPRINT
          printf '\\n[irori]\\nServer = $base/arch/\$arch\\n' | sudo tee -a /etc/pacman.conf
          sudo pacman -Syu irori</pre>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  aur:
    if: vars.PUBLISH_AUR == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: irori-bin
          pkgbuild: manifests/aur/PKGBUILD
          commit_username: Irori release bot
          commit_email: ${{ vars.AUR_COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.TAG }}
          ssh_keyscan_types: ed25519

  homebrew:
    if: vars.PUBLISH_HOMEBREW == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the cask
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../manifests/homebrew/Casks/irori.rb Casks/irori.rb
          git config user.name 'Irori release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/irori.rb
          git diff --cached --quiet || git commit -m "irori ${TAG#v}"
          git push

  scoop:
    if: vars.PUBLISH_SCOOP == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Update the manifest
        working-directory: bucket
        run: |
          mkdir -p bucket
          cp ../manifests/scoop/bucket/irori.json bucket/irori.json
          git config user.name 'Irori release bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/irori.json
          git diff --cached --quiet || git commit -m "irori: Update to version ${TAG#v}"
          git push

  # Irori's own manifests, so every version carries the /CHANNEL=winget switch
  # (an update made from the previous manifest could lose it). wingetcreate
  # opens the pull request on microsoft/winget-pkgs, the first version's too.
  winget:
    if: vars.PUBLISH_WINGET == 'true'
    needs: assets
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $folder = "manifests\winget\manifests\i\Irori\Irori\$version"
          # Microsoft's signed release, from the address its README gives for CI.
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $signature = Get-AuthenticodeSignature .\wingetcreate.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'wingetcreate is not signed by Microsoft' }
          .\wingetcreate.exe submit --prtitle "New version: Irori.Irori version $version" --token $env:WINGET_TOKEN $folder
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited with $LASTEXITCODE" }

  # A source package with both Linux tarballs inside; COPR builds it for each
  # chroot of the project (Fedora x86_64 and aarch64).
  copr:
    if: vars.PUBLISH_COPR == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - name: Build the source package and send it to COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          dnf install -y --setopt=install_weak_deps=False rpm-build copr-cli
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          rpmbuild -bs --define "_sourcedir $PWD/dist" --define "_srcrpmdir $PWD/srpm" manifests/copr/irori.spec
          copr-cli build "$COPR_PROJECT" srpm/*.src.rpm

  # Flathub builds Irori itself from its repository flathub/app.irori.Irori:
  # this opens a pull request there with the tag's manifest and crate list,
  # and Flathub's bot builds, tests and (once merged) publishes it.
  flathub:
    if: vars.PUBLISH_FLATHUB == 'true'
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cargo-sources.json
        run: |
          python -m pip install --quiet 'aiohttp>=3.9.5,<4' 'tomlkit>=0.13.3,<1' 'PyYAML>=6.0.2,<7'
          curl -fsSLo "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
          python "$RUNNER_TEMP/flatpak-cargo-generator.py" Cargo.lock -o "$RUNNER_TEMP/cargo-sources.json"
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests
      - name: Open a pull request on Flathub
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          branch="irori-$version"
          gh auth setup-git
          git clone --depth 1 https://github.com/flathub/app.irori.Irori.git "$RUNNER_TEMP/flathub"
          cd "$RUNNER_TEMP/flathub"
          git checkout -b "$branch"
          cp "$GITHUB_WORKSPACE/manifests/flathub/app.irori.Irori.yml" app.irori.Irori.yml
          cp "$RUNNER_TEMP/cargo-sources.json" cargo-sources.json
          git add app.irori.Irori.yml cargo-sources.json
          if git diff --cached --quiet; then echo "Flathub already has $version"; exit 0; fi
          git -c user.name='Irori release bot' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update to $version"
          git push origin "$branch"
          gh pr create --repo flathub/app.irori.Irori --base master --head "$branch" \
            --title "Update to $version" \
            --body "Irori $version: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
