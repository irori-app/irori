name: Windows on Arm tools
description: >-
  rustup and clang on a windows-11-arm runner, before dtolnay/rust-toolchain.
  The image doesn't promise rustup, and ring builds its aarch64-pc-windows-msvc
  code with clang only.
runs:
  using: composite
  steps:
    - name: rustup
      shell: pwsh
      run: |
        if (!(Get-Command rustup -ErrorAction SilentlyContinue)) {
          $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile $init
          & $init -y --profile minimal --default-toolchain none
          if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }
          Join-Path $env:USERPROFILE '.cargo\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        }
    - name: clang
      shell: pwsh
      run: |
        $llvm = 'C:\Program Files\LLVM\bin'
        if (!(Get-Command clang -ErrorAction SilentlyContinue)) {
          if (!(Test-Path (Join-Path $llvm 'clang.exe'))) { choco install llvm --no-progress -y }
          if (!(Test-Path (Join-Path $llvm 'clang.exe'))) { throw "clang is missing from $llvm" }
          $llvm | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        }
